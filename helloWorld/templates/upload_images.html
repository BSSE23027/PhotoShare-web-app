<!DOCTYPE html>
<html lang="en">
<head>
  <title>Upload Image</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body style="background-color: #20c997">
<style>
 body {
        background: #f5f7fa;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
}
.card {
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .btn-success {
            border-radius: 50px;
            padding: 10px 20px;
            font-weight: 500;
        }

</style>

<div class="container mb-5" >
    <div class="row justify-content-center">
        <div class="col-md-5 mb-4">
            <div class="card p-4 text-center">
                <div class="card-body">
                    <h2 class="card-title mb-3">Upload Your Image</h2>
                    <form method="post" enctype="multipart/form-data" class="p-4 border rounded bg-light shadow-sm">
                        {% csrf_token %}

                        <div class="mb-3">
                        <label for="{{ form.image.id_for_label }}" class="form-label">Select Image</label>
                        {{ form.image }}
                        {% if form.image.errors %}
                        <div class="text-danger">{{ form.image.errors }}</div>
                        {% endif %}
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-upward: 15px;">Upload</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
